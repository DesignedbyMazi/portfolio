<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio CMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Inter:wght@300;400;500;600&display=swap">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0B0B10;--bg-s:#13131A;--bg-e:#1B1B26;--bg-h:#232333;
  --bd:#242433;--bd-h:#36364A;
  --tx:#E8E8F2;--tx-2:#8888A8;--tx-3:#52526A;
  --ac:#6C63FF;--ac-dim:#1E1B3A;--ac-glow:rgba(108,99,255,0.18);
  --ok:#2FD18C;--ok-dim:#0D2A1F;
  --warn:#F5A623;--warn-dim:#2A1F0A;
  --err:#E5404A;--err-dim:#2A0E10;
  --r:8px;--r-sm:5px;--r-lg:12px;
  --font-head:'DM Sans',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
}
html{font-size:15px;-webkit-font-smoothing:antialiased;}
body{font-family:var(--font-body);background:var(--bg);color:var(--tx);min-height:100vh;overflow:hidden;}

/* â”€â”€ SCROLLBAR â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--bd-h);border-radius:10px;}
::-webkit-scrollbar-thumb:hover{background:var(--tx-3);}

/* â”€â”€ LOGIN â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
#login-screen{
  position:fixed;inset:0;background:var(--bg);
  display:flex;align-items:center;justify-content:center;z-index:9999;
}
.login-card{
  width:360px;background:var(--bg-s);border:1px solid var(--bd);
  border-radius:var(--r-lg);padding:36px;
}
.login-logo{
  font-family:var(--font-head);font-size:1rem;font-weight:700;
  color:var(--ac);letter-spacing:0.01em;margin-bottom:4px;
}
.login-sub{font-size:0.75rem;color:var(--tx-3);margin-bottom:32px;font-family:var(--font-head);}
.login-label{
  display:block;font-family:var(--font-head);font-size:0.68rem;font-weight:600;
  color:var(--tx-3);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:8px;
}
.login-input{
  width:100%;padding:11px 14px;background:var(--bg);border:1px solid var(--bd);
  border-radius:var(--r);color:var(--tx);font-family:var(--font-body);font-size:0.88rem;
  outline:none;transition:border-color .2s;
}
.login-input:focus{border-color:var(--ac);}
.login-btn{
  width:100%;margin-top:16px;padding:11px;
  background:var(--ac);color:#fff;border:none;border-radius:var(--r);
  font-family:var(--font-head);font-size:0.88rem;font-weight:600;cursor:pointer;
  transition:opacity .2s,transform .1s;
}
.login-btn:hover{opacity:.9;}
.login-btn:active{transform:scale(.98);}
.login-err{margin-top:10px;font-size:0.75rem;color:var(--err);display:none;font-family:var(--font-head);}

/* â”€â”€ SHELL â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
#app{display:none;height:100vh;overflow:hidden;}
.shell{display:flex;height:100vh;}

/* â”€â”€ TOPBAR â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.topbar{
  position:fixed;top:0;left:0;right:0;height:52px;
  background:var(--bg-s);border-bottom:1px solid var(--bd);
  display:flex;align-items:center;padding:0 20px;gap:14px;z-index:100;
}
.topbar-logo{
  font-family:var(--font-head);font-size:0.85rem;font-weight:700;
  color:var(--tx);letter-spacing:0.02em;
}
.topbar-logo span{color:var(--ac);}
.topbar-sep{width:1px;height:18px;background:var(--bd);}
.topbar-crumb{font-family:var(--font-head);font-size:0.8rem;color:var(--tx-2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.topbar-pill{
  font-family:var(--font-head);font-size:0.68rem;font-weight:600;
  padding:3px 10px;border-radius:20px;letter-spacing:0.03em;
}
.topbar-pill--live{background:var(--ok-dim);color:var(--ok);}
.topbar-pill--draft{background:var(--warn-dim);color:var(--warn);}
.topbar-btn{
  padding:6px 14px;border-radius:var(--r-sm);font-family:var(--font-head);
  font-size:0.78rem;font-weight:600;cursor:pointer;transition:all .15s;border:none;
}
.topbar-btn--primary{background:var(--ac);color:#fff;}
.topbar-btn--primary:hover{opacity:.88;}
.topbar-btn--ghost{background:transparent;color:var(--tx-2);border:1px solid var(--bd);}
.topbar-btn--ghost:hover{background:var(--bg-e);color:var(--tx);border-color:var(--bd-h);}
.topbar-btn--new{background:var(--bg-e);color:var(--tx-2);border:1px solid var(--bd);}
.topbar-btn--new:hover{color:var(--tx);border-color:var(--bd-h);}
.topbar-btn--logout{background:transparent;color:var(--tx-3);border:none;font-size:0.73rem;font-family:var(--font-head);}
.topbar-btn--logout:hover{color:var(--tx-2);}

/* â”€â”€ SIDEBAR â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.sidebar{
  width:228px;flex-shrink:0;background:var(--bg-s);border-right:1px solid var(--bd);
  padding-top:52px;display:flex;flex-direction:column;height:100vh;overflow-y:auto;
}
.sb-group{padding:20px 12px 8px;}
.sb-group-label{
  font-family:var(--font-head);font-size:0.64rem;font-weight:700;
  color:var(--tx-3);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:6px;
}
.sb-list{list-style:none;display:flex;flex-direction:column;gap:2px;}
.sb-item{
  display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:var(--r-sm);
  font-family:var(--font-head);font-size:0.78rem;color:var(--tx-3);
  background:transparent;border:none;cursor:pointer;width:100%;text-align:left;
  transition:all .15s;
}
.sb-item:hover{background:var(--bg-e);color:var(--tx-2);}
.sb-item.active{background:var(--ac-dim);color:var(--ac);box-shadow:inset 2px 0 0 var(--ac);}
.sb-item.active .sb-dot{background:var(--ac);box-shadow:0 0 6px var(--ac);}
.sb-item.hidden-sec .sb-dot{background:var(--tx-3);}
.sb-item.hidden-sec .sb-item-label{opacity:.45;text-decoration:line-through;}
.sb-dot{width:6px;height:6px;border-radius:50%;background:var(--bd-h);flex-shrink:0;transition:all .2s;}
.sb-item-label{flex:1;}
.sb-vis-badge{
  font-size:0.6rem;padding:1px 6px;border-radius:10px;font-weight:600;
  font-family:var(--font-head);letter-spacing:0.03em;
}
.sb-vis-badge--v{background:var(--ok-dim);color:var(--ok);}
.sb-vis-badge--h{background:var(--bg-h);color:var(--tx-3);}

/* â”€â”€ MAIN â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.main{flex:1;overflow-y:auto;padding-top:52px;background:var(--bg);}
.view{display:none;padding:32px;}
.view.active{display:block;}

/* â”€â”€ DASHBOARD â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.dash-header{margin-bottom:28px;}
.dash-title{font-family:var(--font-head);font-size:1.3rem;font-weight:700;color:var(--tx);}
.dash-sub{font-family:var(--font-head);font-size:0.8rem;color:var(--tx-3);margin-top:4px;}
.study-list{display:flex;flex-direction:column;gap:10px;}
.study-card{
  background:var(--bg-s);border:1px solid var(--bd);border-radius:var(--r);
  padding:14px 18px;display:flex;align-items:center;gap:14px;
  cursor:pointer;transition:border-color .2s,background .2s;
}
.study-card:hover{border-color:var(--bd-h);background:var(--bg-e);}
.study-thumb{
  width:54px;height:38px;border-radius:var(--r-sm);
  background:var(--bg-e);overflow:hidden;flex-shrink:0;
}
.study-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.study-thumb-empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:0.7rem;color:var(--tx-3);}
.study-info{flex:1;min-width:0;}
.study-name{font-family:var(--font-head);font-size:0.88rem;font-weight:600;color:var(--tx);}
.study-meta{font-family:var(--font-head);font-size:0.72rem;color:var(--tx-3);margin-top:2px;}
.study-actions{display:flex;gap:8px;flex-shrink:0;}
.study-btn{
  padding:5px 12px;border-radius:var(--r-sm);font-family:var(--font-head);font-size:0.72rem;
  font-weight:500;cursor:pointer;border:1px solid var(--bd);background:transparent;color:var(--tx-2);
  transition:all .15s;
}
.study-btn:hover{background:var(--bg-h);border-color:var(--bd-h);color:var(--tx);}
.study-btn--del:hover{border-color:var(--err-dim);color:var(--err);background:var(--err-dim);}
.empty-state{text-align:center;padding:64px 0;}
.empty-icon{font-size:2.4rem;margin-bottom:16px;opacity:.3;}
.empty-text{font-family:var(--font-head);font-size:0.9rem;color:var(--tx-3);}
.sql-notice{
  margin-top:24px;background:var(--ac-dim);border:1px solid var(--ac);
  border-radius:var(--r);padding:16px 20px;
}
.sql-notice p{font-family:var(--font-head);font-size:0.82rem;color:var(--ac);line-height:1.6;}
.sql-notice button{margin-top:10px;padding:6px 14px;border-radius:var(--r-sm);background:var(--ac);color:#fff;border:none;font-family:var(--font-head);font-size:0.78rem;font-weight:600;cursor:pointer;}

/* â”€â”€ EDITOR SHELL â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.editor-wrap{max-width:820px;}
.editor-header{margin-bottom:28px;}
.editor-title{font-family:var(--font-head);font-size:1.2rem;font-weight:700;color:var(--tx);}
.editor-sub{font-family:var(--font-head);font-size:0.78rem;color:var(--tx-3);margin-top:4px;}
.section-block{margin-bottom:3px;}
.sec-head{
  display:flex;align-items:center;gap:10px;padding:13px 16px;
  background:var(--bg-s);border:1px solid var(--bd);border-radius:var(--r);
  cursor:pointer;user-select:none;transition:border-color .15s;
}
.sec-head:hover{border-color:var(--bd-h);}
.sec-head.open{border-radius:var(--r) var(--r) 0 0;border-color:var(--bd-h);}
.sec-head-label{font-family:var(--font-head);font-size:0.82rem;font-weight:600;color:var(--tx);flex:1;}
.sec-vis-badge{
  font-family:var(--font-head);font-size:0.63rem;font-weight:600;
  padding:2px 8px;border-radius:10px;letter-spacing:0.03em;
}
.sec-vis-badge--v{background:var(--ok-dim);color:var(--ok);}
.sec-vis-badge--h{background:var(--bg-h);color:var(--tx-3);}
.sec-vis-toggle{
  display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--r-sm);
  font-family:var(--font-head);font-size:0.7rem;font-weight:500;
  border:1px solid var(--bd);background:transparent;color:var(--tx-3);cursor:pointer;
  transition:all .15s;
}
.sec-vis-toggle:hover{background:var(--bg-h);border-color:var(--bd-h);color:var(--tx-2);}
.sec-vis-toggle.on{border-color:var(--ok-dim);color:var(--ok);background:var(--ok-dim);}
.sec-vis-toggle.off{border-color:var(--err-dim);color:var(--err);background:var(--err-dim);}
.sec-chevron{color:var(--tx-3);font-size:0.65rem;transition:transform .2s;}
.sec-head.open .sec-chevron{transform:rotate(180deg);}
.sec-body{
  display:none;padding:22px;background:var(--bg-s);
  border:1px solid var(--bd-h);border-top:none;
  border-radius:0 0 var(--r) var(--r);
}
.sec-body.open{display:block;}

/* â”€â”€ FORM â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.frow{margin-bottom:18px;}
.frow:last-child{margin-bottom:0;}
.frow-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px;}
.frow-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:18px;}
.flabel{
  display:block;font-family:var(--font-head);font-size:0.67rem;font-weight:600;
  color:var(--tx-3);letter-spacing:0.09em;text-transform:uppercase;margin-bottom:7px;
}
.finput,.ftextarea,.fselect{
  width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--bd);
  border-radius:var(--r-sm);color:var(--tx);font-family:var(--font-body);font-size:0.83rem;
  outline:none;transition:border-color .2s;
}
.finput:focus,.ftextarea:focus,.fselect:focus{border-color:var(--ac);}
.ftextarea{min-height:82px;resize:vertical;line-height:1.55;}
.ftextarea-lg{min-height:120px;}
.fhint{font-family:var(--font-head);font-size:0.68rem;color:var(--tx-3);margin-top:5px;}
.fdivider{height:1px;background:var(--bd);margin:22px 0;}
.fsub-label{font-family:var(--font-head);font-size:0.68rem;font-weight:700;color:var(--tx-3);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:14px;}

/* Toggle */
.toggle-row{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.toggle-text{font-family:var(--font-head);font-size:0.82rem;color:var(--tx-2);}
.toggle{position:relative;display:inline-block;width:38px;height:20px;flex-shrink:0;}
.toggle input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;inset:0;cursor:pointer;background:var(--bd-h);border-radius:20px;transition:background .2s;}
.toggle-slider::after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;left:3px;top:3px;background:var(--tx-3);transition:transform .2s,background .2s;}
.toggle input:checked+.toggle-slider{background:var(--ac-dim);border:1px solid var(--ac);}
.toggle input:checked+.toggle-slider::after{transform:translateX(18px);background:var(--ac);}

/* Repeat items */
.repeat-list{display:flex;flex-direction:column;gap:10px;}
.repeat-item{
  background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:16px;
}
.repeat-item-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.repeat-item-num{font-family:var(--font-head);font-size:0.7rem;font-weight:700;color:var(--tx-3);letter-spacing:0.06em;text-transform:uppercase;}
.repeat-del{
  padding:3px 9px;border-radius:var(--r-sm);font-family:var(--font-head);font-size:0.7rem;
  border:1px solid var(--bd);background:transparent;color:var(--tx-3);cursor:pointer;transition:all .15s;
}
.repeat-del:hover{border-color:var(--err-dim);color:var(--err);background:var(--err-dim);}
.add-row{
  margin-top:10px;padding:9px 16px;background:transparent;border:1px dashed var(--bd-h);
  color:var(--tx-3);border-radius:var(--r-sm);font-family:var(--font-head);font-size:0.78rem;
  cursor:pointer;width:100%;transition:all .2s;
}
.add-row:hover{border-color:var(--ac);color:var(--ac);background:var(--ac-dim);}

/* Tags */
.tags-wrap{
  display:flex;flex-wrap:wrap;gap:7px;align-items:center;
  padding:7px 10px;background:var(--bg);border:1px solid var(--bd);
  border-radius:var(--r-sm);min-height:40px;
}
.tags-wrap:focus-within{border-color:var(--ac);}
.tag-chip{
  display:flex;align-items:center;gap:5px;background:var(--ac-dim);
  border:1px solid var(--ac);border-radius:4px;padding:2px 8px;
  font-family:var(--font-head);font-size:0.72rem;color:var(--ac);
}
.tag-del{cursor:pointer;background:none;border:none;color:var(--ac);opacity:.6;font-size:0.85rem;line-height:1;padding:0;}
.tag-del:hover{opacity:1;}
.tag-input{border:none;background:transparent;outline:none;font-family:var(--font-body);font-size:0.8rem;color:var(--tx);flex:1;min-width:80px;}

/* Media preview */
.media-prev{margin-top:8px;border-radius:var(--r-sm);overflow:hidden;background:var(--bg-e);}
.media-prev img,.media-prev video{width:100%;max-height:160px;object-fit:cover;display:block;}
.media-prev-empty{padding:18px;text-align:center;font-family:var(--font-head);font-size:0.72rem;color:var(--tx-3);}

/* â”€â”€ TOAST â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.toast{
  position:fixed;bottom:24px;right:24px;z-index:9999;
  padding:11px 18px;border-radius:var(--r);font-family:var(--font-head);font-size:0.82rem;
  font-weight:500;display:none;
}
.toast--ok{background:var(--ok-dim);color:var(--ok);border:1px solid var(--ok);}
.toast--err{background:var(--err-dim);color:var(--err);border:1px solid var(--err);}

/* â”€â”€ SQL MODAL â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.modal-over{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9998;display:none;align-items:center;justify-content:center;}
.modal-over.open{display:flex;}
.modal{background:var(--bg-s);border:1px solid var(--bd-h);border-radius:var(--r-lg);padding:28px;max-width:620px;width:90%;}
.modal-title{font-family:var(--font-head);font-size:1rem;font-weight:700;color:var(--tx);margin-bottom:6px;}
.modal-sub{font-family:var(--font-head);font-size:0.78rem;color:var(--tx-3);margin-bottom:18px;line-height:1.55;}
.modal-code{
  background:var(--bg);border:1px solid var(--bd);border-radius:var(--r-sm);
  padding:16px;font-family:'Courier New',monospace;font-size:0.75rem;color:#7DC983;
  line-height:1.65;overflow-x:auto;white-space:pre;max-height:280px;overflow-y:auto;
}
.modal-close{margin-top:18px;padding:8px 20px;background:var(--ac);color:#fff;border:none;border-radius:var(--r-sm);font-family:var(--font-head);font-size:0.8rem;font-weight:600;cursor:pointer;}
</style>

<!-- â”€â”€ LOGIN â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">Portfolio<span>.</span>CMS</div>
    <div class="login-sub">Admin access Â· Private</div>
    <label class="login-label" for="lp">Password</label>
    <input type="password" class="login-input" id="lp" placeholder="Enter password" autocomplete="current-password">
    <button class="login-btn" id="login-btn">Sign In</button>
    <div class="login-err" id="login-err">Incorrect password. Try again.</div>

async function fetchStudy(id) {

}

async function upsertStudy(payload) {
  if (!supaAvail) { lsSaveStudy(payload); return payload; }
  if (editing) {

      method:'PATCH', headers: hdrs(), body: JSON.stringify({ ...payload, updated_at: new Date().toISOString() })
    });
    if (!r.ok) { const e = await r.json(); throw new Error(e.message || 'Update failed'); }
    return (await r.json())[0];
  } else {
    const r = await fetch(`${SB_URL}/rest/v1/case_studies`, {
      method:'POST', headers: hdrs(), body: JSON.stringify(payload)
    });
    if (!r.ok) { const e = await r.json(); throw new Error(e.message || 'Insert failed'); }
    return (await r.json())[0];
  }
}

async function deleteStudy(id) {

      if (!r.ok) throw new Error('Delete failed');

/* localStorage fallback */
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };

function lsSaveStudy(p) {
  let list = lsGet('cms-studies') || [];
  const existing = list.findIndex(s => s.id === (editing?.id));
  const item = { ...p, id: editing?.id || 'local-' + Date.now(), updated_at: new Date().toISOString() };
  if (existing >= 0) list[existing] = item; else list.push(item);
  lsSet('cms-studies', list);
  return item;
}
function lsGetStudy(id) { return (lsGet('cms-studies')||[]).find(s=>s.id===id)||null; }
function lsDeleteStudy(id) { lsSet('cms-studies', (lsGet('cms-studies')||[]).filter(s=>s.id!==id)); }

function renderEditor() {
  // sidebar
  const nl = document.getElementById('sec-nav-list');
  nl.innerHTML = SECS.map(s => {
    const vis = s.always ? true : (formData.content?.[s.key]?.visible !== false);
    return `<li><button class="sb-item${!vis ? ' hidden-sec' : ''}" id="snav-${s.key}" onclick="scrollSec('${s.key}')">
      <span class="sb-dot"></span>
      <span class="sb-item-label">${s.label}</span>
      ${!s.always ? `<span class="sb-vis-badge sb-vis-badge--${vis?'v':'h'}">${vis?'On':'Off'}</span>` : ''}

  }).join('');
  // main editor
  document.getElementById('view-editor').innerHTML = `

    </div>

function buildSecBlock(s) {
  const open = openSecs.has(s.key);
  const vis = s.always ? true : (formData.content?.[s.key]?.visible !== false);
  return `
    <div class="section-block" id="sec-${s.key}">
      <div class="sec-head${open?' open':''}" onclick="toggleSec('${s.key}')">
        <span class="sec-head-label">${s.label}</span>
        ${!s.always ? `
          <span class="sec-vis-badge sec-vis-badge--${vis?'v':'h'}">${vis?'Visible':'Hidden'}</span>
          <button class="sec-vis-toggle${vis?' on':' off'}" onclick="event.stopPropagation();toggleVis('${s.key}')">
            ${vis ? 'â— Visible' : 'â—‹ Hidden'}
          </button>
        ` : ''}
        <span class="sec-chevron">â–¼</span>
      </div>
      <div class="sec-body${open?' open':''}" id="body-${s.key}">${open ? secFields(s.key) : ''}</div>
    </div>
  `;
}

function toggleSec(key) {
  const head = document.querySelector(`#sec-${key} .sec-head`);
  const body = document.getElementById(`body-${key}`);
  if (openSecs.has(key)) {
    openSecs.delete(key);
    head.classList.remove('open');
    body.classList.remove('open');
  } else {
    openSecs.add(key);
    head.classList.add('open');
    if (!body.innerHTML.trim()) body.innerHTML = secFields(key);
    body.classList.add('open');
  }
}

function toggleVis(key) {
  if (!formData.content[key]) formData.content[key] = {};
  const now = formData.content[key].visible = !(formData.content[key].visible !== false);
  // Update sec head badge + toggle btn
  const block = document.getElementById(`sec-${key}`);
  block.querySelector('.sec-vis-badge').textContent = now ? 'Visible' : 'Hidden';
  block.querySelector('.sec-vis-badge').className = `sec-vis-badge sec-vis-badge--${now?'v':'h'}`;
  const vbtn = block.querySelector('.sec-vis-toggle');
  vbtn.textContent = now ? 'â— Visible' : 'â—‹ Hidden';
  vbtn.className = `sec-vis-toggle${now?' on':' off'}`;
  // Update sidebar
  const si = document.getElementById(`snav-${key}`);
  if (si) {
    si.className = `sb-item${!now?' hidden-sec':''}`;
    const badge = si.querySelector('.sb-vis-badge');
    if (badge) { badge.textContent = now?'On':'Off'; badge.className = `sb-vis-badge sb-vis-badge--${now?'v':'h'}`; }
  }
}

function scrollSec(key) {
  if (!openSecs.has(key)) toggleSec(key);
  setTimeout(() => {
    const el = document.getElementById(`sec-${key}`);

/* â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ FIELDS â”€â”€â”€â”€â”€â”€ */
function secFields(key) {
  switch(key) {
    case 'card':         return fCard();
    case 'hero':         return fHero();
    case 'myRole':       return fMyRole();
    case 'challenge':    return fChallenge();
    case 'research':     return fResearch();
    case 'competitor':   return fCompetitor();
    case 'userResearch': return fUserResearch();
    case 'audit':        return fAudit();
    case 'improvement':  return fImprovement();
    case 'goals':        return fGoals();
    case 'solutions':    return fSolutions();
    case 'outcome':      return fOutcome();
    default: return '';
  }
}

/* helpers */
function g(path) { return path.split('.').reduce((o,k) => o?.[k], formData) ?? ''; }
function inp(path, ph='', type='text') {
  const v = esc(String(g(path)));
  return `<input type="${type}" class="finput" placeholder="${ph}" value="${v}" oninput="sp('${path}',this.value)">`;
}
function num(path, ph='0') {
  const v = g(path);
  return `<input type="number" class="finput" placeholder="${ph}" value="${v}" oninput="sp('${path}',+this.value)">`;
}
function ta(path, ph='', cls='') {
  const v = esc(String(g(path)));
  return `<textarea class="ftextarea${cls?' '+cls:''}" placeholder="${ph}" oninput="sp('${path}',this.value)">${v}</textarea>`;
}
function chk(path, label) {
  const v = g(path);
  return `<div class="toggle-row"><label class="toggle"><input type="checkbox"${v?' checked':''} onchange="sp('${path}',this.checked);updatePill()"><span class="toggle-slider"></span></label><span class="toggle-text">${label}</span></div>`;
}
function sel(path, opts) {
  const cur = g(path);
  return `<select class="fselect" onchange="sp('${path}',this.value)">${opts.map(o=>`<option${cur===o?' selected':''}>${o}</option>`).join('')}</select>`;
}
function mediaPrev(path, type='image') {
  const url = g(path);
  if (!url) return `<div class="media-prev media-prev-empty">No ${type} URL yet</div>`;
  if (type === 'video') return `<div class="media-prev"><video src="${esc(url)}" muted controls></video></div>`;
  return `<div class="media-prev"><img src="${esc(url)}" onerror="this.parentElement.innerHTML='<div class=\\'media-prev-empty\\'>Image failed to load</div>'"></div>`;
}
function tagsEl(path) {
  const tags = g(path) || [];
  const safe = Array.isArray(tags) ? tags : [];
  const id = 'tw-' + path.replace(/[\W]/g,'_');
  return `
    <div class="tags-wrap" id="${id}">
      ${safe.map((t,i)=>`<span class="tag-chip">${esc(t)}<button class="tag-del" onclick="rmTag('${path}',${i},'${id}')">Ã—</button></span>`).join('')}
      <input class="tag-input" placeholder="Type and press Enter" onkeydown="addTag(event,'${path}','${id}')">
    </div>
  `;
}

/* path ops */
function sp(path, val) {
  const keys = path.split('.');
  const last = keys.pop();
  let o = formData;
  for (const k of keys) { if (!o[k]) o[k]={}; o=o[k]; }
  o[last] = val;
}
function addTag(e, path, twId) {
  if (e.key !== 'Enter' && e.key !== ',') return;
  e.preventDefault();
  const v = e.target.value.trim(); if (!v) return;
  let arr = g(path); if (!Array.isArray(arr)) arr=[];
  arr = [...arr, v]; sp(path, arr);
  rerenderTags(path, twId);
}
function rmTag(path, idx, twId) {
  let arr = g(path); if (!Array.isArray(arr)) arr=[];
  arr = arr.filter((_,i)=>i!==idx); sp(path, arr);
  rerenderTags(path, twId);
}
function rerenderTags(path, twId) {
  const arr = g(path)||[];
  const el = document.getElementById(twId);
  if (!el) return;
  el.innerHTML = arr.map((t,i)=>`<span class="tag-chip">${esc(t)}<button class="tag-del" onclick="rmTag('${path}',${i},'${twId}')">Ã—</button></span>`).join('')
    + `<input class="tag-input" placeholder="Type and press Enter" onkeydown="addTag(event,'${path}','${twId}')">`;

function mergeContent(saved) {
  const def = defaultContent();
  const out = { ...def };
  for (const k of Object.keys(def)) { if (saved[k]) out[k] = { ...def[k], ...saved[k] }; }
  return out;
}

async function save() {
  const btn = document.getElementById('btn-save');
  btn.textContent = 'Savingâ€¦'; btn.disabled = true;
  const payload = {
    slug: formData.slug, title: formData.title, description: formData.description,
    card_image_url: formData.card_image_url, published: !!formData.published,
    order: parseInt(formData.order)||0, content: formData.content,
  };
  try {
    const res = await upsertStudy(payload);
    if (res && !editing) editing = res;
    showToast(formData.published ? 'Saved & published âœ“' : 'Saved as draft âœ“', 'ok');
    updatePill();
    await loadStudies();
  } catch(e) { showToast('Save failed: ' + e.message, 'err'); }
  finally { btn.textContent = 'Save'; btn.disabled = false; }
}
