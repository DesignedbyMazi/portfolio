<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio CMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  /* ── Design system tokens (light mode) ── */
  --bg:#FFFFFF;
  --bg-s:#F4F4F4;
  --bg-e:#F9F9F9;
  --bg-h:#EFEFEF;
  --bd:#EAEAEA;
  --bd-h:#DFDFDF;
  --tx:#2D2D2D;
  --tx-2:#5A5A5A;
  --tx-3:#777777;
  --ac:#2D2D2D;
  --ac-dim:#F4F4F4;
  --ok:#11AB2A;--ok-dim:#EBF8ED;
  --warn:#D97706;--warn-dim:#FEF3C7;
  --err:#DC2626;--err-dim:#FEF2F2;
  --r:8px;--r-sm:6px;--r-lg:12px;
  --font-body:'Inter',system-ui,sans-serif;
  --font-head:'Inter',system-ui,sans-serif;
  --shadow-sm:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.04);
}
html{font-size:14px;-webkit-font-smoothing:antialiased;}
body{font-family:var(--font-body);background:var(--bg);color:var(--tx);min-height:100vh;overflow:hidden;}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--bd-h);border-radius:10px;}
::-webkit-scrollbar-thumb:hover{background:#C0C0C0;}

/* ── LOGIN ── */
#login-screen{
  position:fixed;inset:0;background:var(--bg-s);
  display:flex;align-items:center;justify-content:center;z-index:9999;
}
.login-card{
  width:360px;background:var(--bg);border:1px solid var(--bd);
  border-radius:var(--r-lg);padding:36px;box-shadow:var(--shadow-md);
}
.login-logo{
  font-size:0.9rem;font-weight:600;letter-spacing:-0.01em;
  color:var(--tx);margin-bottom:4px;
}
.login-sub{font-size:0.75rem;color:var(--tx-3);margin-bottom:28px;}
.login-label{
  display:block;font-size:0.67rem;font-weight:500;
  color:var(--tx-3);letter-spacing:0.07em;text-transform:uppercase;margin-bottom:6px;
}
.login-input{
  width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--bd);
  border-radius:var(--r);color:var(--tx);font-family:var(--font-body);font-size:0.875rem;
  outline:none;transition:border-color .15s,box-shadow .15s;
}
.login-input:focus{border-color:var(--tx);box-shadow:0 0 0 3px rgba(45,45,45,.08);}
.login-btn{
  width:100%;margin-top:14px;padding:10px;
  background:var(--tx);color:#fff;border:none;border-radius:var(--r);
  font-family:var(--font-body);font-size:0.875rem;font-weight:500;cursor:pointer;
  transition:opacity .15s,transform .1s;
}
.login-btn:hover{opacity:.85;}
.login-btn:active{transform:scale(.99);}
.login-err{margin-top:10px;font-size:0.75rem;color:var(--err);display:none;}

/* ── SHELL ── */
#app{display:none;height:100vh;overflow:hidden;}
.shell{display:flex;height:100vh;}

/* ── TOPBAR ── */
.topbar{
  position:fixed;top:0;left:0;right:0;height:52px;
  background:var(--bg);border-bottom:1px solid var(--bd);
  display:flex;align-items:center;padding:0 20px;gap:12px;z-index:100;
}
.topbar-logo{
  font-size:0.875rem;font-weight:600;letter-spacing:-0.01em;color:var(--tx);
}
.topbar-logo span{color:var(--tx-3);font-weight:400;}
.topbar-sep{width:1px;height:16px;background:var(--bd);}
.topbar-crumb{font-size:0.8rem;color:var(--tx-3);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.topbar-pill{
  font-size:0.67rem;font-weight:500;
  padding:3px 9px;border-radius:20px;letter-spacing:0.02em;
}
.topbar-pill--live{background:var(--ok-dim);color:var(--ok);}
.topbar-pill--draft{background:var(--warn-dim);color:var(--warn);}
.topbar-btn{
  padding:6px 14px;border-radius:var(--r-sm);
  font-size:0.78rem;font-weight:500;cursor:pointer;transition:all .12s;border:none;
  font-family:var(--font-body);
}
.topbar-btn--primary{background:var(--tx);color:#fff;}
.topbar-btn--primary:hover{opacity:.82;}
.topbar-btn--ghost{background:transparent;color:var(--tx-2);border:1px solid var(--bd);}
.topbar-btn--ghost:hover{background:var(--bg-s);color:var(--tx);}
.topbar-btn--new{background:var(--bg-s);color:var(--tx-2);border:1px solid var(--bd);}
.topbar-btn--new:hover{color:var(--tx);border-color:var(--bd-h);}
.topbar-btn--logout{background:transparent;color:var(--tx-3);border:none;font-size:0.73rem;}
.topbar-btn--logout:hover{color:var(--tx-2);}

/* ── SIDEBAR ── */
.sidebar{
  width:220px;flex-shrink:0;background:var(--bg-s);border-right:1px solid var(--bd);
  padding-top:52px;display:flex;flex-direction:column;height:100vh;overflow-y:auto;
}
.sb-group{padding:20px 10px 8px;}
.sb-group-label{
  font-size:0.62rem;font-weight:600;
  color:var(--tx-3);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:6px;padding:0 6px;
}
.sb-list{list-style:none;display:flex;flex-direction:column;gap:1px;}
.sb-item{
  display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--r-sm);
  font-size:0.8rem;color:var(--tx-2);font-weight:400;
  background:transparent;border:none;cursor:pointer;width:100%;text-align:left;
  transition:all .12s;
}
.sb-item:hover{background:var(--bg-h);color:var(--tx);}
.sb-item.active{background:var(--bg);color:var(--tx);box-shadow:var(--shadow-sm);font-weight:500;}
.sb-item.active .sb-dot{background:var(--tx);}
.sb-item.hidden-sec .sb-dot{background:var(--bd-h);}
.sb-item.hidden-sec .sb-item-label{opacity:.4;text-decoration:line-through;}
.sb-dot{width:5px;height:5px;border-radius:50%;background:var(--bd-h);flex-shrink:0;transition:all .2s;}
.sb-item-label{flex:1;}
.sb-vis-badge{
  font-size:0.58rem;padding:1px 5px;border-radius:8px;font-weight:500;
  letter-spacing:0.02em;
}
.sb-vis-badge--v{background:var(--ok-dim);color:var(--ok);}
.sb-vis-badge--h{background:var(--bg-h);color:var(--tx-3);}

/* ── MAIN ── */
.main{flex:1;overflow-y:auto;padding-top:52px;background:var(--bg);}
.view{display:none;padding:32px 36px;}
.view.active{display:block;}

/* ── DASHBOARD ── */
.dash-header{margin-bottom:24px;}
.dash-title{font-size:1.125rem;font-weight:600;color:var(--tx);letter-spacing:-0.02em;}
.dash-sub{font-size:0.8rem;color:var(--tx-3);margin-top:3px;}
.study-list{display:flex;flex-direction:column;gap:6px;}
.study-card{
  background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);
  padding:14px 16px;display:flex;align-items:center;gap:12px;
  cursor:pointer;transition:border-color .12s,box-shadow .12s;
}
.study-card:hover{border-color:var(--bd-h);box-shadow:var(--shadow-sm);}
.study-thumb{
  width:52px;height:36px;border-radius:6px;
  background:var(--bg-s);overflow:hidden;flex-shrink:0;border:1px solid var(--bd);
}
.study-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.study-thumb-empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:0.62rem;color:var(--tx-3);}
.study-info{flex:1;min-width:0;}
.study-name{font-size:0.875rem;font-weight:500;color:var(--tx);}
.study-meta{font-size:0.72rem;color:var(--tx-3);margin-top:2px;}
.study-actions{display:flex;gap:6px;flex-shrink:0;}
.study-btn{
  padding:5px 11px;border-radius:var(--r-sm);font-size:0.72rem;
  font-weight:450;cursor:pointer;border:1px solid var(--bd);background:transparent;color:var(--tx-2);
  transition:all .12s;font-family:var(--font-body);
}
.study-btn:hover{background:var(--bg-s);color:var(--tx);}
.study-btn--del:hover{border-color:#FECACA;color:var(--err);background:var(--err-dim);}

/* ── DRAG & REORDER ── */
.study-card[draggable="true"]{cursor:default;}
.drag-handle{cursor:grab;color:var(--bd-h);font-size:1.1rem;flex-shrink:0;padding:2px 6px 2px 0;user-select:none;transition:color .12s;}
.drag-handle:hover{color:var(--tx-3);}
.drag-handle:active{cursor:grabbing;}
.study-card.dragging{opacity:.35;border-style:dashed;}
.study-card.drag-over{border-color:var(--tx);box-shadow:0 0 0 2px var(--tx);background:var(--bg-s);}
.order-arrows{display:flex;gap:3px;flex-shrink:0;}
.order-arrow{
  padding:4px 8px;border-radius:var(--r-sm);font-size:0.7rem;
  border:1px solid var(--bd);background:transparent;color:var(--tx-3);
  cursor:pointer;transition:all .12s;font-family:var(--font-body);line-height:1;
  title:attr(title);
}
.order-arrow:hover{background:var(--bg-s);color:var(--tx);border-color:var(--bd-h);}
.save-order-bar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 14px;background:var(--warn-dim);border:1px solid #FDE68A;
  border-radius:var(--r);margin-bottom:14px;
}
.save-order-bar-text{font-size:0.78rem;color:var(--warn);font-weight:500;}
.save-order-btn{
  padding:6px 16px;border-radius:var(--r-sm);background:var(--warn);
  color:#fff;border:none;font-size:0.78rem;font-weight:500;
  cursor:pointer;font-family:var(--font-body);white-space:nowrap;
}
.save-order-btn:hover{opacity:.85;}
.save-order-btn:disabled{opacity:.5;cursor:default;}

/* ── AUTO-SAVE STATUS ── */
#autosave-status{
  font-size:0.72rem;display:none;padding:3px 8px;
  border-radius:20px;font-weight:500;transition:all .2s;
}
#autosave-status.saving{display:inline!important;background:var(--bg-s);color:var(--tx-3);}
#autosave-status.saved{display:inline!important;background:var(--ok-dim);color:var(--ok);}
#autosave-status.error{display:inline!important;background:var(--err-dim);color:var(--err);}

.empty-state{text-align:center;padding:64px 0;}
.empty-icon{font-size:2rem;margin-bottom:12px;opacity:.2;}
.empty-text{font-size:0.875rem;color:var(--tx-3);}
.sql-notice{
  margin-top:20px;background:var(--bg-s);border:1px solid var(--bd);
  border-radius:var(--r);padding:16px 20px;
}
.sql-notice p{font-size:0.82rem;color:var(--tx-2);line-height:1.6;}
.sql-notice button{margin-top:10px;padding:6px 14px;border-radius:var(--r-sm);background:var(--tx);color:#fff;border:none;font-size:0.78rem;font-weight:500;cursor:pointer;font-family:var(--font-body);}

/* ── EDITOR SHELL ── */
.editor-wrap{max-width:780px;}
.editor-header{margin-bottom:24px;}
.editor-title{font-size:1.125rem;font-weight:600;color:var(--tx);letter-spacing:-0.02em;}
.editor-sub{font-size:0.78rem;color:var(--tx-3);margin-top:3px;line-height:1.55;}
.section-block{margin-bottom:2px;}
.sec-head{
  display:flex;align-items:center;gap:10px;padding:12px 14px;
  background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);
  cursor:pointer;user-select:none;transition:border-color .12s,background .12s;
}
.sec-head:hover{background:var(--bg-s);}
.sec-head.open{border-radius:var(--r) var(--r) 0 0;border-color:var(--bd-h);}
.sec-head-label{font-size:0.8rem;font-weight:500;color:var(--tx);flex:1;}
.sec-vis-badge{
  font-size:0.6rem;font-weight:500;
  padding:2px 7px;border-radius:8px;letter-spacing:0.02em;
}
.sec-vis-badge--v{background:var(--ok-dim);color:var(--ok);}
.sec-vis-badge--h{background:var(--bg-h);color:var(--tx-3);}
.sec-vis-toggle{
  display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--r-sm);
  font-size:0.7rem;font-weight:450;
  border:1px solid var(--bd);background:transparent;color:var(--tx-3);cursor:pointer;
  transition:all .12s;font-family:var(--font-body);
}
.sec-vis-toggle:hover{background:var(--bg-h);color:var(--tx-2);}
.sec-vis-toggle.on{border-color:#BBF7D0;color:var(--ok);background:var(--ok-dim);}
.sec-vis-toggle.off{border-color:#FECACA;color:var(--err);background:var(--err-dim);}
.sec-chevron{color:var(--tx-3);font-size:0.6rem;transition:transform .2s;}
.sec-head.open .sec-chevron{transform:rotate(180deg);}
.sec-body{
  display:none;padding:20px;background:var(--bg-s);
  border:1px solid var(--bd-h);border-top:none;
  border-radius:0 0 var(--r) var(--r);
}
.sec-body.open{display:block;}

/* ── FORM ── */
.frow{margin-bottom:16px;}
.frow:last-child{margin-bottom:0;}
.frow-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
.frow-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px;}
.flabel{
  display:block;font-size:0.67rem;font-weight:500;
  color:var(--tx-3);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:6px;
}
.finput,.ftextarea,.fselect{
  width:100%;padding:9px 11px;background:var(--bg);border:1px solid var(--bd);
  border-radius:var(--r-sm);color:var(--tx);font-family:var(--font-body);font-size:0.8rem;
  outline:none;transition:border-color .15s,box-shadow .15s;
}
.finput:focus,.ftextarea:focus,.fselect:focus{border-color:var(--tx);box-shadow:0 0 0 3px rgba(45,45,45,.07);}
.ftextarea{min-height:80px;resize:vertical;line-height:1.55;}
.ftextarea-lg{min-height:110px;}
.fhint{font-size:0.67rem;color:var(--tx-3);margin-top:4px;}
.fdivider{height:1px;background:var(--bd);margin:20px 0;}
.fsub-label{font-size:0.67rem;font-weight:600;color:var(--tx-3);letter-spacing:0.07em;text-transform:uppercase;margin-bottom:12px;}

/* Toggle */
.toggle-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.toggle-text{font-size:0.8rem;color:var(--tx-2);}
.toggle{position:relative;display:inline-block;width:36px;height:20px;flex-shrink:0;}
.toggle input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;inset:0;cursor:pointer;background:var(--bd-h);border-radius:20px;transition:background .2s;}
.toggle-slider::after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;left:3px;top:3px;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.15);}
.toggle input:checked+.toggle-slider{background:var(--tx);}
.toggle input:checked+.toggle-slider::after{transform:translateX(16px);}

/* Repeat items */
.repeat-list{display:flex;flex-direction:column;gap:8px;}
.repeat-item{
  background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:14px;
}
.repeat-item-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.repeat-item-num{font-size:0.67rem;font-weight:600;color:var(--tx-3);letter-spacing:0.06em;text-transform:uppercase;}
.repeat-del{
  padding:3px 9px;border-radius:var(--r-sm);font-size:0.7rem;
  border:1px solid var(--bd);background:transparent;color:var(--tx-3);cursor:pointer;transition:all .12s;
  font-family:var(--font-body);
}
.repeat-del:hover{border-color:#FECACA;color:var(--err);background:var(--err-dim);}
.add-row{
  margin-top:8px;padding:8px 14px;background:transparent;border:1px dashed var(--bd-h);
  color:var(--tx-3);border-radius:var(--r-sm);font-size:0.78rem;
  cursor:pointer;width:100%;transition:all .15s;font-family:var(--font-body);
}
.add-row:hover{border-color:var(--tx-3);color:var(--tx-2);background:var(--bg-s);}

/* Tags */
.tags-wrap{
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  padding:6px 10px;background:var(--bg);border:1px solid var(--bd);
  border-radius:var(--r-sm);min-height:38px;
}
.tags-wrap:focus-within{border-color:var(--tx);box-shadow:0 0 0 3px rgba(45,45,45,.07);}
.tag-chip{
  display:flex;align-items:center;gap:4px;background:var(--bg-s);
  border:1px solid var(--bd);border-radius:4px;padding:2px 7px;
  font-size:0.72rem;color:var(--tx);
}
.tag-del{cursor:pointer;background:none;border:none;color:var(--tx-3);font-size:0.85rem;line-height:1;padding:0;}
.tag-del:hover{color:var(--tx);}
.tag-input{border:none;background:transparent;outline:none;font-family:var(--font-body);font-size:0.8rem;color:var(--tx);flex:1;min-width:80px;}

/* Media preview */
.media-prev{margin-top:8px;border-radius:var(--r-sm);overflow:hidden;background:var(--bg-s);border:1px solid var(--bd);}
.media-prev img,.media-prev video{width:100%;max-height:160px;object-fit:cover;display:block;}
.media-prev-empty{padding:18px;text-align:center;font-size:0.72rem;color:var(--tx-3);}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:24px;right:24px;z-index:9999;
  padding:10px 16px;border-radius:var(--r);font-size:0.8rem;
  font-weight:500;display:none;box-shadow:var(--shadow-md);
}
.toast--ok{background:var(--ok-dim);color:var(--ok);border:1px solid #BBF7D0;}
.toast--err{background:var(--err-dim);color:var(--err);border:1px solid #FECACA;}

/* ── UPLOAD CARD ── */
.upload-card{border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;margin-top:6px;}
.uc-zone{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  padding:28px 20px;cursor:pointer;background:var(--bg-s);transition:background .15s;min-height:90px;
}
.uc-zone:hover,.uc-zone.dragover{background:var(--bg-h);}
.uc-preview{width:100%;background:#000;position:relative;}
.uc-preview img{width:100%;max-height:220px;object-fit:cover;display:block;}
.uc-preview video{width:100%;max-height:220px;display:block;}
.uc-replace{font-size:0.68rem;color:var(--tx-3);padding:7px 12px;text-align:center;background:var(--bg-s);cursor:pointer;transition:background .12s;}
.uc-replace:hover{background:var(--bg-h);color:var(--tx-2);}
.uc-icon{font-size:1.4rem;line-height:1;opacity:.25;}
.uc-text{font-size:0.8rem;font-weight:500;color:var(--tx-2);}
.uc-hint{font-size:0.68rem;color:var(--tx-3);}
.uc-progress{padding:9px 14px;font-size:0.75rem;color:var(--tx-2);background:var(--bg-s);text-align:center;border-top:1px solid var(--bd);}
.uc-err{padding:8px 12px;font-size:0.7rem;color:var(--err);text-align:center;}

/* ── SQL MODAL ── */
.modal-over{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:9998;display:none;align-items:center;justify-content:center;}
.modal-over.open{display:flex;}
.modal{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r-lg);padding:28px;max-width:620px;width:90%;box-shadow:var(--shadow-md);}
.modal-title{font-size:1rem;font-weight:600;color:var(--tx);margin-bottom:6px;letter-spacing:-0.01em;}
.modal-sub{font-size:0.78rem;color:var(--tx-3);margin-bottom:18px;line-height:1.55;}
.modal-code{
  background:var(--bg-s);border:1px solid var(--bd);border-radius:var(--r-sm);
  padding:16px;font-family:'Courier New',monospace;font-size:0.75rem;color:#5A5A5A;
  line-height:1.65;overflow-x:auto;white-space:pre;max-height:280px;overflow-y:auto;
}
.modal-close{margin-top:16px;padding:8px 20px;background:var(--tx);color:#fff;border:none;border-radius:var(--r-sm);font-size:0.8rem;font-weight:500;cursor:pointer;font-family:var(--font-body);}
</style>

<!-- ── LOGIN ── -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">Portfolio<span>.</span>CMS</div>
    <div class="login-sub">Admin access · Private</div>
    <label class="login-label" for="lp">Password</label>
    <input type="password" class="login-input" id="lp" placeholder="Enter password" autocomplete="current-password">
    <button class="login-btn" id="login-btn">Sign In</button>
    <div class="login-err" id="login-err">Incorrect password. Try again.</div>
  </div>
</div>

<!-- ── APP ── -->
<div id="app">
  <div class="topbar">
    <span class="topbar-logo">Portfolio<span>.</span>CMS</span>
    <div class="topbar-sep"></div>
    <span class="topbar-crumb" id="tb-crumb">Dashboard</span>

async function loadStudies() {

    const r = await fetch(`${SB_URL}/rest/v1/case_studies?select=id,slug,title,card_image_url,published,order,updated_at&order=order.asc`, { headers: hdrs() });

async function fetchStudy(id) {
  const r = await fetch(`${SB_URL}/rest/v1/case_studies?id=eq.${encodeURIComponent(id)}&select=*`, { headers: hdrs() });
  if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.message || 'Failed to load study'); }
  const arr = await r.json();
  if (!arr || arr.length === 0) throw new Error('Case study not found in Supabase');
  return arr[0];
}

async function upsertStudy(payload) {
  if (editing) {
    const r = await fetch(`${SB_URL}/rest/v1/case_studies?id=eq.${encodeURIComponent(editing.id)}`, {
      method:'PATCH', headers: hdrs(), body: JSON.stringify({ ...payload, updated_at: new Date().toISOString() })
    });
    if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.message || e.error || 'Update failed'); }
    const rows = await r.json();
    if (!rows || rows.length === 0) throw new Error('Update returned no data — check Supabase RLS policies');
    return rows[0];
  } else {
    const r = await fetch(`${SB_URL}/rest/v1/case_studies`, {
      method:'POST', headers: hdrs(), body: JSON.stringify(payload)
    });
    if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.message || e.error || 'Insert failed'); }
    const rows = await r.json();
    if (!rows || rows.length === 0) throw new Error('Supabase insert returned no data — check RLS policies allow anonymous inserts');
    return rows[0];
  }
}

async function deleteStudy(id) {

}

    ${orderDirty ? `

  if (!iso) return 'never';

/* ─────────────────────────────── DRAG & REORDER ─── */
function onDragStart(e, idx) {
  dragSrcIdx = idx;
  setTimeout(() => e.currentTarget.classList.add('dragging'), 0);
  e.dataTransfer.effectAllowed = 'move';
}
function onDragOver(e, idx) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.study-card').forEach(c => c.classList.remove('drag-over'));
  const cards = document.querySelectorAll('.study-card');
  if (cards[idx]) cards[idx].classList.add('drag-over');
}
function onDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
function onDragEnd(e) {
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.study-card').forEach(c => c.classList.remove('drag-over', 'dragging'));
}
function onDrop(e, idx) {
  e.preventDefault();
  if (dragSrcIdx === null || dragSrcIdx === idx) { dragSrcIdx = null; return; }
  const moved = studies.splice(dragSrcIdx, 1)[0];
  studies.splice(idx, 0, moved);
  orderDirty = true;
  dragSrcIdx = null;
  renderDash(studies);
}
function moveToTop(id) {
  const idx = studies.findIndex(s => s.id === id);
  if (idx <= 0) return;
  studies.unshift(studies.splice(idx, 1)[0]);
  orderDirty = true;
  renderDash(studies);
}
function moveToBottom(id) {
  const idx = studies.findIndex(s => s.id === id);
  if (idx < 0 || idx === studies.length - 1) return;
  studies.push(studies.splice(idx, 1)[0]);
  orderDirty = true;
  renderDash(studies);
}
async function saveOrder() {
  const btn = document.getElementById('save-order-btn');

        method: 'PATCH',
        headers: hdrs(),
        body: JSON.stringify({ order: i, updated_at: new Date().toISOString() }),
      })
    ));
    orderDirty = false;
    showToast('Order saved — portfolio updated ✓', 'ok');
    await loadStudies();
  } catch(e) {
    showToast('Failed to save order: ' + e.message, 'err');
    if (btn) { btn.textContent = 'Save Order'; btn.disabled = false; }

}

/* ─────────────────────────────── AUTO-SAVE ─── */
function scheduleAutoSave() {
  if (!document.getElementById('view-editor').classList.contains('active')) return;
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(autoSaveNow, 2500);
}
function setAutoSaveStatus(state) {
  const el = document.getElementById('autosave-status');
  if (!el) return;
  if (state === 'saving') { el.className = 'saving'; el.textContent = 'Auto-saving…'; }
  else if (state === 'saved') { el.className = 'saved'; el.textContent = 'Saved ✓'; setTimeout(() => { el.className = ''; el.textContent = ''; el.style.display='none'; }, 2500); }
  else if (state === 'error') { el.className = 'error'; el.textContent = 'Auto-save failed'; }
  else { el.className = ''; el.textContent = ''; el.style.display = 'none'; }
}
async function autoSaveNow() {
  if (autoSaving) return;
  // New study: need slug before we can create the record
  if (!editing && !formData.slug) return;
  autoSaving = true;
  setAutoSaveStatus('saving');
  const payload = {
    slug: formData.slug, title: formData.title, description: formData.description,
    card_image_url: formData.card_image_url, published: formData.published,
    order: parseInt(formData.order) || 0, content: formData.content,
  };
  try {
    const res = await upsertStudy(payload);
    if (res && !editing) { editing = res; }
    setAutoSaveStatus('saved');
    loadStudies().catch(() => {});
  } catch(e) {
    setAutoSaveStatus('error');
  }
  autoSaving = false;
}

/* ─────────────────────────────── EDITOR ────── */
const SECS = [
  { key:'card',        label:'Card Details',          always:true },
  { key:'hero',        label:'Hero Section' },
  { key:'myRole',      label:'My Role' },
  { key:'challenge',   label:'The Challenge' },
  { key:'research',    label:'Research Intro' },
  { key:'competitor',  label:'Competitor Analysis' },
  { key:'userResearch',label:'User Research' },
  { key:'audit',       label:'Product Audit' },
  { key:'improvement', label:'Product Improvement' },
  { key:'goals',       label:'Goals' },
  { key:'solutions',   label:'Solutions' },
  { key:'outcome',     label:'Outcome' },
];

function startNew() { editing = null; formData = defaultFD(); showEditor('New Case Study'); }

function autoSlug(title) {
  if (formData.slug && formData.slug !== '') return; // don't overwrite a manually set slug
  const slug = title.trim().toLowerCase()
    .replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-').slice(0,60);
  sp('slug', slug);
  const el = document.querySelector('input[oninput*="sp(\'slug\'"]');
  if (el) el.value = slug;
}

async function openEdit(id) {
  try {
    const s = await fetchStudy(id);
    if (!s) { showToast('Could not load study', 'err'); return; }
    editing = s;
    formData = {
      slug: s.slug || '', title: s.title || '', description: s.description || '',
      card_image_url: s.card_image_url || '', published: !!s.published, order: s.order || 0,
      content: mergeContent(s.content || {}),
    };
    showEditor(s.title || 'Edit Study');
  } catch(e) { showToast('Failed to load: ' + e.message, 'err'); }
}

function showEditor(title) {
  document.getElementById('view-dash').classList.remove('active');
  document.getElementById('view-editor').classList.add('active');
  document.getElementById('btn-new').style.display = 'none';
  ['btn-preview','btn-draft','btn-publish','btn-dash'].forEach(id => {
    document.getElementById(id).style.display = 'flex';
  });
  document.getElementById('tb-pill').style.display = 'flex';
  document.getElementById('sec-nav-group').style.display = 'block';
  document.getElementById('tb-crumb').textContent = title;
  renderEditor();
  updatePill();
}

function renderEditor() {
  const nl = document.getElementById('sec-nav-list');
  nl.innerHTML = SECS.map(s => {
    const vis = s.always ? true : (formData.content?.[s.key]?.visible !== false);
    return `<li><button class="sb-item${!vis ? ' hidden-sec' : ''}" id="snav-${s.key}" onclick="scrollSec('${s.key}')">
      <span class="sb-dot"></span>
      <span class="sb-item-label">${s.label}</span>
      ${!s.always ? `<span class="sb-vis-badge sb-vis-badge--${vis?'v':'h'}">${vis?'On':'Off'}</span>` : ''}
    </button></li>`;
  }).join('');
  document.getElementById('view-editor').innerHTML = `
    <div class="editor-wrap">
      <div class="editor-header">
        <div class="editor-title">${editing ? 'Edit Case Study' : 'New Case Study'}</div>
        <div class="editor-sub">Expand sections below – toggle visibility to hide individual sections from the live portfolio without deleting content.</div>
      </div>
      ${SECS.map(s => buildSecBlock(s)).join('')}
      <div style="height:80px"></div>
    </div>
  `;
}

function buildSecBlock(s) {
  const open = openSecs.has(s.key);
  const vis = s.always ? true : (formData.content?.[s.key]?.visible !== false);
  return `
    <div class="section-block" id="sec-${s.key}">
      <div class="sec-head${open?' open':''}" onclick="toggleSec('${s.key}')">
        <span class="sec-head-label">${s.label}</span>
        ${!s.always ? `
          <span class="sec-vis-badge sec-vis-badge--${vis?'v':'h'}">${vis?'Visible':'Hidden'}</span>
          <button class="sec-vis-toggle${vis?' on':' off'}" onclick="event.stopPropagation();toggleVis('${s.key}')">
            ${vis ? '● Visible' : '○ Hidden'}
          </button>
        ` : ''}
        <span class="sec-chevron">▼</span>
      </div>
      <div class="sec-body${open?' open':''}" id="body-${s.key}">${open ? secFields(s.key) : ''}</div>
    </div>
  `;
}

function toggleSec(key) {
  const head = document.querySelector(`#sec-${key} .sec-head`);
  const body = document.getElementById(`body-${key}`);
  if (openSecs.has(key)) {
    openSecs.delete(key);
    head.classList.remove('open');
    body.classList.remove('open');
  } else {
    openSecs.add(key);
    head.classList.add('open');
    if (!body.innerHTML.trim()) body.innerHTML = secFields(key);
    body.classList.add('open');
  }
}

function toggleVis(key) {
  if (!formData.content[key]) formData.content[key] = {};
  const now = formData.content[key].visible = !(formData.content[key].visible !== false);
  const block = document.getElementById(`sec-${key}`);
  block.querySelector('.sec-vis-badge').textContent = now ? 'Visible' : 'Hidden';
  block.querySelector('.sec-vis-badge').className = `sec-vis-badge sec-vis-badge--${now?'v':'h'}`;
  const vbtn = block.querySelector('.sec-vis-toggle');
  vbtn.textContent = now ? '● Visible' : '○ Hidden';
  vbtn.className = `sec-vis-toggle${now?' on':' off'}`;
  const si = document.getElementById(`snav-${key}`);
  if (si) {
    si.className = `sb-item${!now?' hidden-sec':''}`;
    const badge = si.querySelector('.sb-vis-badge');
    if (badge) { badge.textContent = now?'On':'Off'; badge.className = `sb-vis-badge sb-vis-badge--${now?'v':'h'}`; }
  }
}

function scrollSec(key) {
  if (!openSecs.has(key)) toggleSec(key);
  setTimeout(() => {
    const el = document.getElementById(`sec-${key}`);
    if (el) el.scrollIntoView({ behavior:'smooth', block:'start' });
  }, 50);
}

function updatePill() {
  const p = document.getElementById('tb-pill');
  p.textContent = formData.published ? 'Live' : 'Draft';
  p.className = `topbar-pill topbar-pill--${formData.published?'live':'draft'}`;
}

/* ─────────────────────────────── FIELDS ────── */
function secFields(key) {
  switch(key) {
    case 'card':         return fCard();
    case 'hero':         return fHero();
    case 'myRole':       return fMyRole();
    case 'challenge':    return fChallenge();
    case 'research':     return fResearch();
    case 'competitor':   return fCompetitor();
    case 'userResearch': return fUserResearch();
    case 'audit':        return fAudit();
    case 'improvement':  return fImprovement();
    case 'goals':        return fGoals();
    case 'solutions':    return fSolutions();
    case 'outcome':      return fOutcome();
    default: return '';
  }
}

/* helpers */
function g(path) { return path.split('.').reduce((o,k) => o?.[k], formData) ?? ''; }
function inp(path, ph='', type='text') {
  const v = esc(String(g(path)));
  return `<input type="${type}" class="finput" placeholder="${ph}" value="${v}" oninput="sp('${path}',this.value)">`;
}
function num(path, ph='0') {
  const v = g(path);
  return `<input type="number" class="finput" placeholder="${ph}" value="${v}" oninput="sp('${path}',+this.value)">`;
}
function ta(path, ph='', cls='') {
  const v = esc(String(g(path)));
  return `<textarea class="ftextarea${cls?' '+cls:''}" placeholder="${ph}" oninput="sp('${path}',this.value)">${v}</textarea>`;
}
function chk(path, label) {
  const v = g(path);
  return `<div class="toggle-row"><label class="toggle"><input type="checkbox"${v?' checked':''} onchange="sp('${path}',this.checked);updatePill()"><span class="toggle-slider"></span></label><span class="toggle-text">${label}</span></div>`;
}
function sel(path, opts) {
  const cur = g(path);
  return `<select class="fselect" onchange="sp('${path}',this.value)">${opts.map(o=>`<option${cur===o?' selected':''}>${o}</option>`).join('')}</select>`;
}
function mediaPrev(path, type='image') {
  const url = g(path);
  if (!url) return `<div class="media-prev media-prev-empty">No ${type} URL yet</div>`;
  if (type === 'video') return `<div class="media-prev"><video src="${esc(url)}" muted controls></video></div>`;
  return `<div class="media-prev"><img src="${esc(url)}" onerror="this.parentElement.innerHTML='<div class=\\'media-prev-empty\\'>Image failed to load</div>'"></div>`;
}
function tagsEl(path) {
  const tags = g(path) || [];
  const safe = Array.isArray(tags) ? tags : [];
  const id = 'tw-' + path.replace(/[\W]/g,'_');
  return `
    <div class="tags-wrap" id="${id}">
      ${safe.map((t,i)=>`<span class="tag-chip">${esc(t)}<button class="tag-del" onclick="rmTag('${path}',${i},'${id}')">×</button></span>`).join('')}
      <input class="tag-input" placeholder="Type and press Enter" onkeydown="addTag(event,'${path}','${id}')">
    </div>
  `;
}

/* path ops */
function sp(path, val) {
  const keys = path.split('.');
  const last = keys.pop();
  let o = formData;
  for (const k of keys) { if (!o[k]) o[k]={}; o=o[k]; }
  o[last] = val;
  scheduleAutoSave();
}
function addTag(e, path, twId) {
  if (e.key !== 'Enter' && e.key !== ',') return;
  e.preventDefault();
  const v = e.target.value.trim(); if (!v) return;
  let arr = g(path); if (!Array.isArray(arr)) arr=[];
  arr = [...arr, v]; sp(path, arr);
  rerenderTags(path, twId);
}
function rmTag(path, idx, twId) {
  let arr = g(path); if (!Array.isArray(arr)) arr=[];
  arr = arr.filter((_,i)=>i!==idx); sp(path, arr);
  rerenderTags(path, twId);
}
function rerenderTags(path, twId) {
  const arr = g(path)||[];
  const el = document.getElementById(twId);
  if (!el) return;
  el.innerHTML = arr.map((t,i)=>`<span class="tag-chip">${esc(t)}<button class="tag-del" onclick="rmTag('${path}',${i},'${twId}')">×</button></span>`).join('')
    + `<input class="tag-input" placeholder="Type and press Enter" onkeydown="addTag(event,'${path}','${twId}')">`;
  el.querySelector('.tag-input').focus();
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function mergeContent(saved) {
  const def = defaultContent();
  const out = { ...def };
  for (const k of Object.keys(def)) { if (saved[k]) out[k] = { ...def[k], ...saved[k] }; }
  return out;
}

/* ─────────────────────────────── SAVE / PUBLISH ─── */
async function _doSave(publishState, btnId, labelBusy, labelDone) {
  if (!formData.slug) { showToast('Add a slug first (Card & Publish section)', 'err'); return; }
  const btn = document.getElementById(btnId);
  btn.textContent = labelBusy; btn.disabled = true;
  formData.published = publishState;
  const payload = {
    slug: formData.slug, title: formData.title, description: formData.description,
    card_image_url: formData.card_image_url, published: publishState,
    order: parseInt(formData.order)||0, content: formData.content,
  };
  try {
    const res = await upsertStudy(payload);
    if (res && !editing) { editing = res; }
    showToast(labelDone, 'ok');
    updatePill();
    await loadStudies();
  } catch(e) { showToast('Error: ' + e.message, 'err'); }
  finally { btn.textContent = btnId === 'btn-draft' ? 'Save Draft' : 'Publish'; btn.disabled = false; }
}

function saveDraft() { _doSave(false, 'btn-draft', 'Saving…', 'Saved as draft'); }

async function publish() {
  const saved = await _doSave(true, 'btn-publish', 'Publishing…', 'Published – now live ✓');
  return saved;
}

async function previewStudy() {
  if (!formData.slug) { showToast('Add a slug first so we know the URL', 'err'); return; }
  const btn = document.getElementById('btn-preview');
  btn.textContent = 'Saving…'; btn.disabled = true;
  try {
    const payload = {
      slug: formData.slug, title: formData.title, description: formData.description,
      card_image_url: formData.card_image_url, published: false,
      order: parseInt(formData.order)||0, content: formData.content,
    };
    const res = await upsertStudy(payload);
    if (res && !editing) editing = res;
    await loadStudies();
    const previewUrl = window.location.origin + '/case-study/' + encodeURIComponent(formData.slug);
    window.open(previewUrl, '_blank', 'noopener');
    showToast('Saved · Preview opened in new tab', 'ok');
  } catch(e) { showToast('Could not save before preview: ' + e.message, 'err'); }
  finally { btn.textContent = 'Preview ↗'; btn.disabled = false; }
}

/* ─────────────────────────────── STORAGE ────── */
async function uploadToStorage(file, folder) {
  const ext = (file.name.split('.').pop() || 'bin').toLowerCase();
  const uid = Date.now() + '-' + Math.random().toString(36).slice(2, 7);
  const path = `${folder || 'general'}/${uid}.${ext}`;
  const r = await fetch(`${SB_URL}/storage/v1/object/cms-media/${path}`, {
    method: 'POST',
    headers: {
      'apikey': SB_KEY,
      'Authorization': `Bearer ${SB_KEY}`,
      'Content-Type': file.type || 'application/octet-stream',
      'x-upsert': 'true',
    },
    body: file,
  });
  if (!r.ok) {
    const e = await r.json().catch(() => ({}));
    throw new Error(e.error || e.message || `Upload failed (${r.status})`);
  }
  return `${SB_URL}/storage/v1/object/public/cms-media/${path}`;
}

function isVideoUrl(url) {
  return /\.(mp4|webm|mov|avi|m4v|ogv)$/i.test(url || '');
}

function uploadCard(path, accept) {
  const url = g(path);
  const wid = 'ucw-' + path.replace(/\W/g, '_');
  const isVid = url && (accept === 'video/*' || isVideoUrl(url));
  return `
    <div class="upload-card" id="${wid}">
      <input type="file" id="ufi-${wid}" accept="${accept || 'image/*,video/*'}" style="display:none"
             onchange="handleUpload(this,'${path}','${wid}','${accept || ''}')">
      <div class="uc-zone" id="zone-${wid}"
           onclick="document.getElementById('ufi-${wid}').click()"
           ondragover="event.preventDefault();this.classList.add('dragover')"
           ondragleave="this.classList.remove('dragover')"
           ondrop="handleDrop(event,'${path}','${wid}','${accept || ''}')">
        ${url ? `
          <div class="uc-preview" style="width:100%">
            ${isVid
              ? `<video src="${esc(url)}" muted controls style="width:100%;max-height:220px;display:block"></video>`
              : `<img src="${esc(url)}" style="width:100%;max-height:220px;object-fit:cover;display:block"
                      onerror="this.parentElement.innerHTML='<div class=uc-err>Could not load preview</div>'">`
            }
          </div>
          <div class="uc-replace" onclick="event.stopPropagation();document.getElementById('ufi-${wid}').click()">
            Click or drag to replace
          </div>
        ` : `
          <div class="uc-icon">&#8593;</div>
          <div class="uc-text">Click to upload or drag &amp; drop</div>
          <div class="uc-hint">Images and videos &middot; Any format</div>
        `}
      </div>
      <div class="uc-progress" id="uprog-${wid}" style="display:none"></div>
    </div>
  `;
}

async function handleUpload(input, path, wid, accept) {
  const file = input.files?.[0]; if (!file) return;
  const prog = document.getElementById(`uprog-${wid}`);
  if (prog) { prog.style.display = 'block'; prog.textContent = `Uploading ${file.name}…`; }
  const zone = document.getElementById(`zone-${wid}`);
  if (zone) zone.style.pointerEvents = 'none';
  try {
    const folder = formData.slug || 'general';
    const url = await uploadToStorage(file, folder);
    sp(path, url);
    const wrap = document.getElementById(wid);
    if (wrap) wrap.outerHTML = uploadCard(path, accept);
    showToast('Uploaded successfully', 'ok');
  } catch(e) {
    if (prog) prog.textContent = 'Upload failed: ' + e.message;
    if (zone) zone.style.pointerEvents = '';
    showToast('Upload failed: ' + e.message, 'err');
  }
}

function handleDrop(event, path, wid, accept) {
  event.preventDefault();
  const file = event.dataTransfer?.files?.[0]; if (!file) return;
  const fakeInput = { files: [file], accept };
  handleUpload(fakeInput, path, wid, accept);
}
